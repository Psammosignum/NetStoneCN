name: Build and pack

on:
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./NetStoneCN.sln

      - name: Build
        run: dotnet build ./NetStoneCN.sln --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack ./NetStoneCN/NetStoneCN.csproj --configuration Release --no-restore --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
